<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Symphony in Olib</title>
    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/stage.css" />
    <link rel="stylesheet" href="/style/hud.css" />
  </head>
  <body>
    <!-- Everything OBS captures lives inside #stage, and nothing else does. -->
    <main id="stage">
      <div id="container"></div>
    </main>

    <!-- HUD: outside the stage, cropped away in OBS. DESIGN.md §13.2 -->
    <footer id="hud">
      <div class="hud-bar">
        <div class="move-handle" id="opt-move" title="Drag to move window">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path fill="currentColor" d="M8 0 11 4 9 4 9 7 12 7 12 5 16 8 12 11 12 9 9 9 9 12 11 12 8 16 5 12 7 12 7 9 4 9 4 11 0 8 4 5 4 7 7 7 7 4 5 4Z"/>
          </svg>
        </div>
        <span class="hud-title">Symphony in Olib</span>
        <button id="opt-close" title="Close">&#10005;</button>
      </div>

      <div class="readouts">
        <div class="readout"><span class="label">BPM</span><span class="value" id="r-bpm">—</span><span class="sub">est <code id="r-est">—</code></span></div>
        <div class="readout"><span class="label">Source</span><span class="value" id="r-source">none</span></div>
        <div class="readout"><span class="label">Confidence</span><span class="value" id="r-conf">—</span></div>
        <div class="readout"><span class="label">Preset</span><span class="value" id="r-preset">—</span><span class="sub" id="r-energy">—</span></div>
        <div class="readout beat"><span class="label">Beat</span><span class="dot" id="r-beat"></span></div>

        <div class="meters" id="r-meters">
          <div class="meter" data-band="kick"><span class="name">kick</span><span class="bar"><i></i></span><span class="led"></span></div>
          <div class="meter" data-band="snare"><span class="name">snare</span><span class="bar"><i></i></span><span class="led"></span></div>
          <div class="meter" data-band="hat"><span class="name">hat</span><span class="bar"><i></i></span><span class="led"></span></div>
        </div>
      </div>
      <div class="strip">
        <span class="crop">OBS crop <code id="r-crop">—</code></span>
        <span class="fps">FPS <code id="r-fps">—</code></span>
        <span class="clip">Clipped <code id="r-clip">0</code></span>
        <span class="hint"><kbd>Tab</kbd> hide HUD &nbsp;·&nbsp; <kbd>Space</kbd> tap tempo &nbsp;·&nbsp; <kbd>Esc</kbd> auto tempo</span>
      </div>
      <section id="options">
        <label class="field">
          <span>Audio source</span>
          <select id="opt-device"><option value="">Loading…</option></select>
        </label>

        <label class="field">
          <span>Layouts</span>
          <select id="opt-layout">
            <option value="centre">Centre — uses whole stage</option>
            <option value="edges">Edges — keeps middle clear</option>
            <option value="all">All</option>
          </select>
        </label>

        <label class="field">
          <span>Palette</span>
          <select id="opt-palette">
            <option value="acid">Acid</option>
            <option value="mono">Mono</option>
            <option value="warm">Warm</option>
            <option value="cool">Cool</option>
            <option value="none">None</option>
          </select>
        </label>

        <label class="field">
          <span>Background</span>
          <select id="opt-bg">
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="transparent">Transparent</option>
          </select>
        </label>
        <span class="status" id="opt-status">Not capturing</span>

        <div class="sens" id="opt-sens">
          <span class="sens-title">Onset sensitivity</span>
          <label><span>kick</span><input type="range" data-band="kick" min="0.5" max="5" step="0.1" /><code>—</code></label>
          <label><span>snare</span><input type="range" data-band="snare" min="0.5" max="5" step="0.1" /><code>—</code></label>
          <label><span>hat</span><input type="range" data-band="hat" min="0.5" max="5" step="0.1" /><code>—</code></label>
        </div>
      </section>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
